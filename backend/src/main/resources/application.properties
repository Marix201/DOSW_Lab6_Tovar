spring.application.name=todo-api

# Optional local file with secrets (never committed). See .env.example at the repository root.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todo_db}
spring.datasource.username=${DB_USERNAME:todo_user}
spring.datasource.password=${DB_PASSWORD:todo_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT: the signing secret has no default on purpose; the application refuses to start without JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=todo-api
app.jwt.expiration=30m

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Optional, local development only: bootstraps an ADMIN account when both are set.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
